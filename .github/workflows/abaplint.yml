name: abaplint

on:
  push:
    paths: ['ops-suite/**', '.github/workflows/abaplint.yml']
  pull_request:
    paths: ['ops-suite/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Pinned to the version used for the offline evidence (audit A01/A24): a floating
      # @2 tag ran 2.120.19 in CI while the evidence was produced with 2.120.92
      - name: Install abaplint
        run: npm install -g @abaplint/cli@2.120.92
      - name: Syntax and house rules (abaplint.json)
        run: abaplint abaplint.json
      - name: Show versions
        run: abaplint --version && python3 --version
      - name: Generator tests (serializer stages output, never writes partial XML)
        run: python3 -m unittest discover -s tools/tests -v
      - name: ATC-equivalent checks (abaplint.atc.json)
        run: python3 tools/portable_checks.py "$(command -v abaplint)"
